<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>绵羊草原场景编辑器</title>
<style>
  :root{
    --blue:#2E7CF6;
    --paper:#F4EFE6;
    --ink:#2C2A26;
    --line:#E4E1D9;
    --active:#EFECE4;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;overflow:hidden;background:var(--paper);color:var(--ink);
    font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  canvas{display:block;position:fixed;inset:0;z-index:0;}

  #brand{position:fixed;top:26px;left:28px;z-index:5;pointer-events:none;display:flex;flex-direction:column;gap:8px;}
  #brand .name{font-size:11px;font-weight:600;letter-spacing:.34em;text-transform:uppercase;color:#4B463C;}
  #brand .sub{font-size:11.5px;color:#A39B8B;letter-spacing:.01em;}
  #tip{position:fixed;left:26px;bottom:22px;z-index:5;pointer-events:none;font-size:10.5px;color:#8F8777;
    letter-spacing:.03em;padding:7px 12px;border-radius:999px;background:rgba(244,239,230,.8);
    border:1px solid rgba(228,225,217,.9);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);}

  #env{
    position:fixed;top:24px;right:26px;z-index:6;width:190px;
    padding:11px 12px 10px;border-radius:12px;
    background:var(--env-bg, rgba(255,252,246,.42));
    border:1px solid var(--env-line, rgba(90,80,60,.18));
    box-shadow:0 8px 22px rgba(30,24,12,.14);
    backdrop-filter:blur(12px) saturate(1.2);-webkit-backdrop-filter:blur(12px) saturate(1.2);
    user-select:none;-webkit-user-select:none;color:var(--env-ink, #4A463E);font-size:11px;
    transition:none;
  }
  .env-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:7px;}
  #clock{font-size:18px;font-weight:600;letter-spacing:.02em;color:var(--env-strong, #2C2A26);font-variant-numeric:tabular-nums;}
  #phase{color:var(--env-muted, #8F8777);}
  #time{width:100%;margin:0 0 8px;accent-color:#2E7CF6;height:14px;cursor:pointer;}
  .env-weather{display:flex;gap:4px;}
  .env-weather button{
    flex:1;font:inherit;font-size:11px;color:var(--env-ink, #6B6558);background:transparent;
    border:1px solid var(--env-line, rgba(90,80,60,.18));border-radius:7px;padding:5px 0;cursor:pointer;
    transition:background .14s ease,color .14s ease,border-color .14s ease;
  }
  .env-weather button:hover{background:#F6F3EC;}
  .env-weather button:hover{background:var(--env-hover, rgba(255,255,255,.18));}
  .env-weather button.active{background:var(--env-active, #2E2A24);border-color:var(--env-active, #2E2A24);color:var(--env-active-ink, #FFF9EF);}
  body[data-phase="night"] #brand .name{color:#EFE8DA;}
  body[data-phase="night"] #brand .sub{color:#BBB4A6;}
  body[data-phase="night"] #vignette{
    background:
      radial-gradient(72% 62% at 50% 44%, rgba(0,0,0,0) 52%, rgba(8,12,22,.42) 100%),
      radial-gradient(52% 44% at 26% 16%, rgba(120,150,210,.10), rgba(0,0,0,0) 70%);
  }
  @media (max-width:640px){
    #env{top:14px;right:14px;width:160px;padding:9px 10px 8px;}
    #clock{font-size:16px;}
  }
  #overlay{position:fixed;inset:0;z-index:10;pointer-events:none;overflow:hidden;user-select:none;-webkit-user-select:none;}
  #box{position:absolute;display:none;border:1px solid var(--blue);}
  .handle{position:absolute;display:none;width:7px;height:7px;background:#fff;border:1px solid var(--blue);transform:translate(-50%,-50%);}
  #label{
    position:absolute;display:none;transform:translateX(-50%);
    background:var(--blue);color:#fff;font-size:11px;line-height:1.2;
    padding:5px 7px;border-radius:4px;white-space:nowrap;letter-spacing:.01em;
    font-variant-numeric:tabular-nums;
  }
  #toolbar{
    position:absolute;display:none;align-items:center;gap:1px;
    background:#fff;border:1px solid var(--line);border-radius:9px;
    box-shadow:0 4px 14px rgba(60,50,30,.14);
    padding:3px 5px;pointer-events:auto;user-select:none;
  }
  .beh{
    font:inherit;font-size:12.5px;line-height:1;color:#6B6558;background:transparent;
    border:0;border-radius:6px;padding:6px 9px;cursor:pointer;white-space:nowrap;
    transition:background .14s ease,color .14s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .beh:hover{background:#F6F3EC;}
  .beh.active{background:var(--active);color:#2C2A26;}
  .divider{width:1px;height:16px;background:var(--line);margin:0 4px;flex:0 0 auto;}
  .icon{
    width:28px;height:28px;display:flex;align-items:center;justify-content:center;
    background:transparent;border:0;border-radius:6px;padding:0;color:#5A554B;cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .icon:hover{background:#F6F3EC;}
  .icon:disabled{opacity:.3;cursor:default;background:transparent;}
  .icon svg{width:16px;height:16px;display:block;}

  #lasso{position:fixed;inset:0;z-index:9;pointer-events:none;width:100%;height:100%;display:block;}
  #vignette{
    position:fixed;inset:0;z-index:4;pointer-events:none;
    background:
      radial-gradient(72% 62% at 50% 44%, rgba(255,255,255,0) 52%, rgba(96,74,44,.10) 100%),
      radial-gradient(52% 44% at 26% 16%, rgba(255,247,220,.28), rgba(255,247,220,0) 70%);
  }

  #rainVeil{
    position:fixed;inset:0;z-index:3;pointer-events:none;opacity:0;
    background:linear-gradient(180deg, rgba(120,145,165,.30), rgba(70,90,110,.10) 45%, rgba(40,60,80,.32));
  }
  #fallback{position:fixed;inset:0;z-index:50;display:none;place-items:center;background:var(--paper);}
  #fallback.show{display:grid;}
  #fallback .card{text-align:center;padding:32px;max-width:420px;}
  #fallback strong{display:block;font-size:14px;letter-spacing:.04em;margin-bottom:10px;}
  #fallback span{font-size:12px;line-height:1.8;color:#8C8576;}
</style>
</head>
<body>

<div id="brand">
  <span class="name">草原</span>
  <span class="sub">点击绵羊，编辑它的行为</span>
</div>
<div id="env">
  <div class="env-head"><span id="clock">08:00</span><span id="phase">白天</span></div>
  <input id="time" type="range" min="0" max="24" step="0.05" value="8" aria-label="时间">
  <div class="env-weather">
    <button id="w-sunny" class="active" type="button">晴</button>
    <button id="w-rain" type="button">雨</button>
    <button id="w-snow" type="button">雪</button>
  </div>
</div>
<div id="tip">拖动选择框移动 · 在草地上画圈添加 · 右键拖动旋转视角</div>
<canvas id="lasso"></canvas>
<div id="vignette"></div>
<div id="rainVeil"></div>

<div id="overlay">
  <div id="box"></div>
  <div id="label"></div>
  <div id="toolbar">
    <button class="beh" data-state="idle">待机</button>
    <button class="beh" data-state="graze">吃草</button>
    <button class="beh" data-state="walk">行走</button>
    <button class="beh" data-state="jump">跳跃</button>
    <div class="divider"></div>
    <button class="icon" id="btn-undo" title="撤销" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9.5 14.5 4.5 9.5l5-5"/><path d="M4.5 9.5h9a5.5 5.5 0 0 1 0 11h-2"/>
      </svg>
    </button>
    <button class="icon" id="btn-redo" title="重做" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12a7 7 0 1 1-2.05-4.95"/><path d="M19 4.5V10h-5.5"/>
      </svg>
    </button>
    <button class="icon" id="btn-dup" title="复制">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="9" width="10" height="10" rx="2.2"/>
        <path d="M15 9V6.2A2.2 2.2 0 0 0 12.8 4H6.2A2.2 2.2 0 0 0 4 6.2v6.6A2.2 2.2 0 0 0 6.2 15H9"/>
      </svg>
    </button>
    <button class="icon" id="btn-del" title="删除">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4.5 6.5h15"/><path d="M9.5 6.5V4.8c0-.7.6-1.3 1.3-1.3h2.4c.7 0 1.3.6 1.3 1.3v1.7"/>
        <path d="M6.5 6.5 7.6 20a1.5 1.5 0 0 0 1.5 1.4h5.8a1.5 1.5 0 0 0 1.5-1.4l1.1-13.5"/>
        <path d="M10.3 10.5v6.6M13.7 10.5v6.6"/>
      </svg>
    </button>
  </div>
</div>

<div id="fallback">
  <div class="card">
    <strong>场景加载失败</strong>
    <span>这个页面需要联网，从 unpkg 载入 three.js。<br>请检查网络后刷新重试。</span>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script>
  window.__meadowReady = false;
  setTimeout(function () {
    if (!window.__meadowReady) document.getElementById('fallback').classList.add('show');
  }, 9000);
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================================================
   0 · helpers
   ============================================================ */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a || 1), 0, 1); return t * t * (3 - 2 * t); };
const dmp = (dt, k) => 1 - Math.exp(-k * dt);
const easeOut = t => 1 - Math.pow(1 - t, 3);
const angleLerp = (a, b, t) => a + Math.atan2(Math.sin(b - a), Math.cos(b - a)) * t;
const dist2 = (ax, az, bx, bz) => Math.hypot(ax - bx, az - bz);

/* shared wind field: random gusts, slowly swinging direction */
const wind = { base: 0.2, value: 0.2, target: 0.24, timer: 0, x: 1, z: 0.2, ang: 0.55 };
function updateWind(dt, t) {
  wind.timer -= dt;
  if (wind.timer <= 0) {
    wind.timer = 2.2 + Math.random() * 3.8;
    wind.target = Math.random() < 0.18 ? 0.82 + Math.random() * 0.42 : 0.05 + Math.random() * 0.45;
  }
  wind.base += (wind.target - wind.base) * Math.min(1, dt * 1.15);
  const gust = 0.085 * Math.sin(t * 0.9 + 2.1) + 0.05 * Math.sin(t * 2.3 + 0.7) + 0.028 * Math.sin(t * 4.7 + 1.7);
  wind.value = clamp(wind.base + gust, 0, 1.3);
  wind.ang = 0.55 + Math.sin(t * 0.13) * 0.5 + Math.sin(t * 0.37) * 0.18;
  wind.x = Math.cos(wind.ang);
  wind.z = Math.sin(wind.ang);
}

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rnd = mulberry32(0x5ee1a7);

/* ============================================================
   1 · island metrics — a rounded-square turf patch
   ============================================================ */
const ISL = { a: 22, b: 14.5, r: 7 };
const ISL_W = 44;
const ISL_D = 29;
const MASK_W = 46;
const MASK_D = 31;
const KEEP_X = -12.2;
const BG = '#F4EFE6';

const terrainH = (x, z) =>
  0.04 * Math.sin(x * 0.25) * Math.cos(z * 0.30) +
  0.015 * Math.sin(x * 0.8 + z * 0.6);

function islandSDF(x, z, margin) {
  margin = margin || 0;
  const a = ISL.a - margin;
  const b = ISL.b - margin;
  const r = Math.max(0.6, ISL.r - margin);
  const qx = Math.abs(x) - (a - r);
  const qz = Math.abs(z) - (b - r);
  return Math.hypot(Math.max(qx, 0), Math.max(qz, 0)) + Math.min(Math.max(qx, qz), 0) - r;
}

function roundedRectPoints(a, b, r, n) {
  r = Math.min(r, a, b);
  const sx = a - r, sz = b - r;
  const segs = [];
  const L = (x0, z0, x1, z1, nx, nz) => segs.push({ t: 'l', x0: x0, z0: z0, x1: x1, z1: z1, nx: nx, nz: nz, len: Math.hypot(x1 - x0, z1 - z0) });
  const A = (cx, cz, a0, a1) => segs.push({ t: 'a', cx: cx, cz: cz, a0: a0, a1: a1, len: Math.abs(a1 - a0) * r });
  L(-sx, -b, sx, -b, 0, -1);
  A(sx, -sz, -Math.PI / 2, 0);
  L(a, -sz, a, sz, 1, 0);
  A(sx, sz, 0, Math.PI / 2);
  L(sx, b, -sx, b, 0, 1);
  A(-sx, sz, Math.PI / 2, Math.PI);
  L(-a, sz, -a, -sz, -1, 0);
  A(-sx, -sz, Math.PI, Math.PI * 1.5);
  const total = segs.reduce((s, g) => s + g.len, 0);
  const out = [];
  for (let i = 0; i < n; i++) {
    let t = (i / n) * total;
    for (const g of segs) {
      if (t <= g.len) {
        if (g.t === 'l') {
          const k = g.len ? t / g.len : 0;
          out.push({ x: lerp(g.x0, g.x1, k), z: lerp(g.z0, g.z1, k), nx: g.nx, nz: g.nz });
        } else {
          const ang = g.a0 + (g.a1 - g.a0) * (g.len ? t / g.len : 0);
          out.push({ x: g.cx + Math.cos(ang) * r, z: g.cz + Math.sin(ang) * r, nx: Math.cos(ang), nz: Math.sin(ang) });
        }
        break;
      }
      t -= g.len;
    }
  }
  return out;
}

/* ============================================================
   2 · renderer / scene / camera
   ============================================================ */
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.VSMShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.06;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const bgCanvas = document.createElement('canvas');
bgCanvas.width = 1280;
bgCanvas.height = 720;
const bgCtx = bgCanvas.getContext('2d');
const bgTex = new THREE.CanvasTexture(bgCanvas);
bgTex.colorSpace = THREE.SRGBColorSpace;
scene.background = bgTex;

const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 400);
camera.position.set(0, 52.5, 34.5);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 2.0, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.enablePan = false;
controls.minDistance = 26;
controls.maxDistance = 110;
controls.minPolarAngle = 0.16;
controls.maxPolarAngle = 1.12;
controls.rotateSpeed = 0.72;
controls.zoomSpeed = 0.85;
controls.mouseButtons = { LEFT: THREE.MOUSE.ROTATE, MIDDLE: THREE.MOUSE.DOLLY, RIGHT: THREE.MOUSE.ROTATE };
controls.update();
camera.updateMatrixWorld(true);

/* ============================================================
   3 · lighting
   ============================================================ */
const hemi = new THREE.HemisphereLight(0xEAF3FF, 0x84905A, 0.92);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xFFF4DC, 2.15);
sun.position.set(-16, 32, -11);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -30;
sun.shadow.camera.right = 30;
sun.shadow.camera.top = 28;
sun.shadow.camera.bottom = -28;
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 100;
sun.shadow.bias = -0.0002;
sun.shadow.normalBias = 0.03;
sun.shadow.radius = 5;
sun.shadow.blurSamples = 12;
sun.shadow.camera.updateProjectionMatrix();
scene.add(sun);
scene.add(sun.target);

const ambient = new THREE.AmbientLight(0xFFFFFF, 0.3);
scene.add(ambient);

/* ============================================================
   4 · textures
   ============================================================ */
const GRASS_PX = 2048, GRASS_PY = 1400;

function makeGrassTexture() {
  const c = document.createElement('canvas');
  c.width = GRASS_PX; c.height = GRASS_PY;
  const g = c.getContext('2d');

  g.fillStyle = '#7FB93A';
  g.fillRect(0, 0, GRASS_PX, GRASS_PY);

  const fields = ['#6FA82C', '#8CC94C', '#A2D45C', '#7CB535', '#B7E27A', '#C9E596', '#93CA4E', '#68A027'];
  for (let i = 0; i < 92; i++) {
    const x = rnd() * GRASS_PX;
    const y = rnd() * GRASS_PY;
    const rx = 180 + rnd() * 380;
    const ry = 130 + rnd() * 300;
    const rot = rnd() * Math.PI;
    const col = fields[Math.floor(rnd() * fields.length)];
    g.save();
    g.translate(x, y);
    g.rotate(rot);
    g.scale(rx, ry);
    const grd = g.createRadialGradient(0, 0, 0.05, 0, 0, 1);
    grd.addColorStop(0, col + 'AA');
    grd.addColorStop(1, col + '00');
    g.fillStyle = grd;
    g.beginPath(); g.arc(0, 0, 1, 0, TAU); g.fill();
    g.restore();
  }

  for (let i = 0; i < 9; i++) {
    const fx = 220 + rnd() * (GRASS_PX - 440);
    const fy = 160 + rnd() * (GRASS_PY - 320);
    const fr = 220 + rnd() * 260;
    const n = 10;
    const fpts = [];
    for (let k = 0; k < n; k++) {
      const a = (k / n) * TAU;
      const rr = fr * (0.55 + rnd() * 0.65);
      fpts.push([fx + Math.cos(a) * rr, fy + Math.sin(a) * rr * (0.6 + rnd() * 0.3)]);
    }
    g.beginPath();
    g.moveTo((fpts[0][0] + fpts[n - 1][0]) / 2, (fpts[0][1] + fpts[n - 1][1]) / 2);
    for (let k = 0; k < n; k++) {
      const pp = fpts[k], qq = fpts[(k + 1) % n];
      g.quadraticCurveTo(pp[0], pp[1], (pp[0] + qq[0]) / 2, (pp[1] + qq[1]) / 2);
    }
    g.closePath();
    g.fillStyle = ['#7DB539', '#93CC4D', '#A4D75F', '#74AD30', '#B4DF72'][i % 5];
    g.globalAlpha = 0.15 + rnd() * 0.16;
    g.fill();
    g.globalAlpha = 1;
    g.strokeStyle = 'rgba(50,90,26,0.12)';
    g.lineWidth = 3 + rnd() * 3;
    g.shadowColor = 'rgba(50,90,26,0.2)';
    g.shadowBlur = 9;
    g.stroke();
    g.shadowBlur = 0;
  }

  g.lineCap = 'round';
  g.lineJoin = 'round';
  g.shadowColor = 'rgba(52,94,30,0.22)';
  g.shadowBlur = 6;
  for (let i = 0; i < 6; i++) {
    const x0 = rnd() * GRASS_PX;
    const y0 = rnd() * GRASS_PY;
    const steps = 3 + Math.floor(rnd() * 4);
    let ang = rnd() * TAU;
    const pts = [[x0, y0]];
    let x = x0, y = y0;
    for (let k = 0; k < steps; k++) {
      ang += (rnd() - 0.5) * 1.1;
      const len = 300 + rnd() * 340;
      x += Math.cos(ang) * len;
      y += Math.sin(ang) * len;
      pts.push([x, y]);
    }
    g.strokeStyle = 'rgba(50,90,26,0.44)';
    g.lineWidth = 11 + rnd() * 8;
    g.beginPath();
    g.moveTo(pts[0][0], pts[0][1]);
    for (let k = 1; k < pts.length - 1; k++) {
      const mx = (pts[k][0] + pts[k + 1][0]) / 2;
      const my = (pts[k][1] + pts[k + 1][1]) / 2;
      g.quadraticCurveTo(pts[k][0], pts[k][1], mx, my);
    }
    g.lineTo(pts[pts.length - 1][0], pts[pts.length - 1][1]);
    g.stroke();

    if (rnd() > 0.6) {
      const b = pts[Math.floor(rnd() * pts.length)];
      const ba = ang + (rnd() > 0.5 ? 1 : -1) * (0.6 + rnd() * 0.8);
      g.strokeStyle = 'rgba(54,96,30,0.34)';
      g.lineWidth = 4 + rnd() * 4;
      g.beginPath();
      g.moveTo(b[0], b[1]);
      g.lineTo(b[0] + Math.cos(ba) * (80 + rnd() * 160), b[1] + Math.sin(ba) * (80 + rnd() * 160));
      g.stroke();
    }
  }

  const strokes = ['#6BA92F', '#5C9826', '#9BD65C', '#B0E470', '#7CBB3C', '#4F8F22'];
  for (let i = 0; i < 4000; i++) {
    const x = rnd() * GRASS_PX;
    const y = rnd() * GRASS_PY;
    const a = rnd() * TAU;
    const len = 7 + rnd() * 17;
    g.strokeStyle = strokes[Math.floor(rnd() * strokes.length)];
    g.globalAlpha = 0.16 + rnd() * 0.36;
    g.lineWidth = 2 + rnd() * 3;
    g.beginPath();
    g.moveTo(x, y);
    g.lineTo(x + Math.cos(a) * len, y + Math.sin(a) * len);
    g.stroke();
  }
  g.globalAlpha = 1;

  for (let i = 0; i < 9000; i++) {
    const x = rnd() * GRASS_PX, y = rnd() * GRASS_PY;
    g.globalAlpha = 0.1 + rnd() * 0.22;
    g.fillStyle = rnd() > 0.5 ? '#5E9A28' : '#AEDF70';
    g.fillRect(x, y, 1 + rnd() * 2, 1 + rnd() * 2);
  }
  g.globalAlpha = 1;

  for (let cl = 0; cl < 24; cl++) {
    const cx = rnd() * GRASS_PX;
    const cy = rnd() * GRASS_PY;
    const spread = 90 + rnd() * 220;
    for (let i = 0; i < 88; i++) {
      const a = rnd() * TAU;
      const rr = Math.sqrt(rnd()) * spread;
      const r = 2.8 + rnd() * 4.8;
      g.globalAlpha = 0.5 + rnd() * 0.45;
      g.fillStyle = rnd() > 0.3 ? '#F4CC3D' : '#FFE07A';
      g.beginPath(); g.arc(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr, r, 0, TAU); g.fill();
    }
  }
  for (let i = 0; i < 260; i++) {
    g.globalAlpha = 0.35 + rnd() * 0.4;
    g.fillStyle = rnd() > 0.45 ? '#FFFDF4' : '#F8E9A4';
    g.beginPath();
    g.arc(rnd() * GRASS_PX, rnd() * GRASS_PY, 1.8 + rnd() * 2.8, 0, TAU);
    g.fill();
  }
  g.globalAlpha = 1;

  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.wrapS = tex.wrapT = THREE.ClampToEdgeWrapping;
  tex.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  return tex;
}

function makeMaskTexture() {
  const MW = 1024, MH = 672;
  const c = document.createElement('canvas');
  c.width = MW; c.height = MH;
  const g = c.getContext('2d');
  g.clearRect(0, 0, MW, MH);

  const halfW = 22 / MASK_W * MW;
  const halfH = 14.5 / MASK_D * MH;
  const rad = 7 / MASK_W * MW;
  const cx = MW / 2, cy = MH / 2;

  const basePts = roundedRectPoints(halfW, halfH, rad, 420);
  const edge = [];
  for (const p of basePts) {
    const ang = Math.atan2(p.z, p.x);
    const off = 5.0 * Math.sin(ang * 3 + 0.7) + 3.2 * Math.sin(ang * 7 + 2.1) + 2.2 * Math.sin(ang * 11 + 0.3);
    edge.push({ x: p.x + p.nx * off, z: p.z + p.nz * off, nx: p.nx, nz: p.nz });
  }
  g.fillStyle = '#fff';
  g.beginPath();
  edge.forEach((p, i) => {
    const X = cx + p.x, Y = cy + p.z;
    i ? g.lineTo(X, Y) : g.moveTo(X, Y);
  });
  g.closePath();
  g.fill();

  for (const p of edge) {
    for (let k = 0; k < 2; k++) {
      const off = Math.pow(rnd(), 1.7) * 20;
      g.globalAlpha = 0.08 + rnd() * 0.3;
      g.fillStyle = '#fff';
      g.beginPath(); g.arc(cx + p.x + p.nx * off, cy + p.z + p.nz * off, 1 + rnd() * 5, 0, TAU); g.fill();
    }
  }
  for (let i = 0; i < 600; i++) {
    const p = edge[Math.floor(rnd() * edge.length)];
    const off = rnd() * 8;
    g.globalAlpha = 0.2 + rnd() * 0.5;
    g.fillStyle = '#fff';
    g.beginPath();
    g.arc(cx + p.x + p.nx * off, cy + p.z + p.nz * off, 2 + rnd() * 5, 0, TAU);
    g.fill();
  }
  g.globalAlpha = 1;

  const soft = document.createElement('canvas');
  soft.width = MW; soft.height = MH;
  const sg = soft.getContext('2d');
  sg.filter = 'blur(3.2px)';
  sg.drawImage(c, 0, 0);

  const tex = new THREE.CanvasTexture(soft);
  tex.colorSpace = THREE.NoColorSpace;
  tex.wrapS = tex.wrapT = THREE.ClampToEdgeWrapping;
  return tex;
}

function makeWheatTexture() {
  const S = 512;
  const c = document.createElement('canvas');
  c.width = c.height = S;
  const g = c.getContext('2d');
  g.fillStyle = '#D8B74C';
  g.fillRect(0, 0, S, S);
  for (let i = 0; i < 2400; i++) {

    g.globalAlpha = 0.25 + rnd() * 0.5;
    g.fillStyle = rnd() > 0.5 ? '#C6A238' : '#EDD582';
    if (rnd() > 0.55) g.fillRect(x, y, 1.6, 4 + rnd() * 7);
    else { g.beginPath(); g.arc(x, y, 0.8 + rnd() * 1.7, 0, TAU); g.fill(); }
  }
  g.globalAlpha = 1;
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(4, 3);

function makeBlobTexture() {
  const S = 128;
  const c = document.createElement('canvas');
  c.width = c.height = S;
  const g = c.getContext('2d');
  const grd = g.createRadialGradient(S / 2, S / 2, 2, S / 2, S / 2, S / 2);
  grd.addColorStop(0, 'rgba(255,255,255,0.9)');

  g.fillStyle = grd;
  g.fillRect(0, 0, S, S);

  tex.colorSpace = THREE.NoColorSpace;
  return tex;
}

function ribbon(points, width, opts) {
  const list = [];
  for (let i = 0; i < points.length; i++) {
    const p = points[i];
    const prev = points[Math.max(0, i - 1)];
    const next = points[Math.min(points.length - 1, i + 1)];
    let tx = next.x - prev.x, tz = next.z - prev.z;
    const l = Math.hypot(tx, tz) || 1;
    tx /= l; tz /= l;
    list.push({ x: p.x, z: p.z, nx: -tz, nz: tx });
  }
  const hw = width / 2;
  const pos = [], uv = [], idx = [], maskUv = [];
  for (let i = 0; i < list.length; i++) {
    const s = list[i];
    const x1 = s.x + s.nx * hw, z1 = s.z + s.nz * hw;
    const x2 = s.x - s.nx * hw, z2 = s.z - s.nz * hw;
    pos.push(x1, terrainH(x1, z1) + opts.lift, z1);
    pos.push(x2, terrainH(x2, z2) + opts.lift, z2);
    uv.push(0, i / (list.length - 1));
    uv.push(1, i / (list.length - 1));
    maskUv.push((x1 + MASK_W / 2) / MASK_W, (z1 + MASK_D / 2) / MASK_D);
    maskUv.push((x2 + MASK_W / 2) / MASK_W, (z2 + MASK_D / 2) / MASK_D);
  }
  for (let i = 0; i < list.length - 1; i++) {
    const a = i * 2, b = a + 1, c = a + 2, d = a + 3;
    idx.push(a, c, b, b, c, d);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  geo.setAttribute('aMaskUv', new THREE.Float32BufferAttribute(maskUv, 2));
  geo.setIndex(idx);
  geo.computeVertexNormals();

  const mat = new THREE.MeshStandardMaterial({
    color: opts.map ? 0xFFFFFF : opts.color,
    map: opts.map || null,
    roughness: 1,
    metalness: 0,
  });
  if (opts.masked) {
    mat.transparent = true;
    mat.onBeforeCompile = shader => {
      shader.uniforms.uMask = { value: islandMaskTex };
      shader.vertexShader = 'attribute vec2 uv;\nattribute vec2 aMaskUv;\nvarying vec2 vMaskUv;\nvarying vec2 vRibbonUv;\n' + shader.vertexShader;
      shader.vertexShader = shader.vertexShader.replace(
        '#include <begin_vertex>',
        '#include <begin_vertex>\n  vMaskUv = aMaskUv;\n  vRibbonUv = uv;'
      );
      shader.fragmentShader = 'uniform sampler2D uMask;\nvarying vec2 vMaskUv;\nvarying vec2 vRibbonUv;\n' + shader.fragmentShader;
      shader.fragmentShader = shader.fragmentShader.replace(
        '#include <alphamap_fragment>',
        '#include <alphamap_fragment>\n  diffuseColor.a *= texture2D(uMask, vMaskUv).a;\n  diffuseColor.a *= smoothstep(0.0, 0.16, vRibbonUv.x) * (1.0 - smoothstep(0.84, 1.0, vRibbonUv.x));'
      );
    };
  }
  const mesh = new THREE.Mesh(geo, mat);
  mesh.receiveShadow = true;
  mesh.renderOrder = opts.order || 0;
  scene.add(mesh);
  return mesh;
}

    '  float w2 = noise(vec2(f.x * 20.0 + 4.0, f.y * 26.0 - t * 0.8 * ws));',

  const polyPx = poly.map(pt => ({
    x: (pt[0] - x0) / (x1 - x0) * S,
    y: (pt[1] - z0) / (z1 - z0) * S,
  }));
  const polyCx = polyPx.reduce((a, p) => a + p.x, 0) / polyPx.length;
  const polyCy = polyPx.reduce((a, p) => a + p.y, 0) / polyPx.length;

  const maskPts = [];
  for (let i = 0; i < polyPx.length; i++) {
    const a = polyPx[i], b = polyPx[(i + 1) % polyPx.length];
    for (let k = 0; k < 7; k++) {
      const t = k / 7;
      const x = lerp(a.x, b.x, t);
      const y = lerp(a.y, b.y, t);
      const ang = Math.atan2(y - polyCy, x - polyCx);
      const n = 7 * Math.sin(i * 1.7 + k * 0.9) + 4.5 * Math.sin(i * 3.1 + k * 1.3);
      maskPts.push([x + Math.cos(ang) * n, y + Math.sin(ang) * n]);
    }
  }

  const m = document.createElement('canvas');
  m.width = S; m.height = S;
  const mg = m.getContext('2d');
  mg.filter = 'blur(2px)';
  mg.fillStyle = '#fff';
  mg.beginPath();
  maskPts.forEach((pt, i) => { i ? mg.lineTo(pt[0], pt[1]) : mg.moveTo(pt[0], pt[1]); });
  mg.closePath();
  mg.fill();
  g.globalCompositeOperation = 'destination-in';
  g.drawImage(m, 0, 0);
  g.globalCompositeOperation = 'source-over';

  g.globalCompositeOperation = 'destination-out';
  g.fillStyle = '#000';
  for (let i = 0; i < 16; i++) {
    const pt = polyPx[Math.floor(rnd() * polyPx.length)];
    const ang = rnd() * TAU;
    const off = 8 + rnd() * 34;
    g.globalAlpha = 0.45 + rnd() * 0.45;
    g.beginPath();
    g.arc(pt.x + Math.cos(ang) * off, pt.y + Math.sin(ang) * off, 8 + rnd() * 26, 0, TAU);
    g.fill();
  }
  g.globalAlpha = 1;
  g.globalCompositeOperation = 'source-over';

  for (let i = 0; i < 360; i++) {
    const pt = polyPx[Math.floor(rnd() * polyPx.length)];
    const ang = Math.atan2(pt.y - polyCy, pt.x - polyCx) + (rnd() - 0.5) * 1.1;
    const off = 4 + rnd() * 52;
    const x = pt.x + Math.cos(ang) * off + (rnd() - 0.5) * 26;
    const y = pt.y + Math.sin(ang) * off + (rnd() - 0.5) * 26;
    g.globalAlpha = 0.25 + rnd() * 0.45;
    g.fillStyle = rnd() > 0.5 ? '#C9A33A' : '#E8D078';
    if (rnd() > 0.35) g.fillRect(x, y, 1.6 + rnd() * 2.2, 5 + rnd() * 9);
    else { g.beginPath(); g.arc(x, y, 1.5 + rnd() * 3, 0, TAU); g.fill(); }
  }
  g.globalAlpha = 1;

  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.flipY = false;
  tex.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());

  const fieldY = (x, z) => {
    let d = Infinity;
    for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
      const ax = poly[j][0], az = poly[j][1], bx = poly[i][0], bz = poly[i][1];
      const vx = bx - ax, vz = bz - az;
      const t = clamp(((x - ax) * vx + (z - az) * vz) / (vx * vx + vz * vz || 1), 0, 1);
      d = Math.min(d, Math.hypot(x - (ax + vx * t), z - (az + vz * t)));
    }
    const k = clamp(d / 1.8, 0, 1);
    return terrainH(x, z) + 0.05 + 0.07 * (k * k * (3 - 2 * k));
  };

  const NX = 30, NZ = 24;
  const pos = [], uv = [], idx = [];
  for (let iz = 0; iz <= NZ; iz++) {
    const z = z0 + (z1 - z0) * iz / NZ;
    for (let ix = 0; ix <= NX; ix++) {
      const x = x0 + (x1 - x0) * ix / NX;
      pos.push(x, fieldY(x, z), z);
      uv.push(ix / NX, iz / NZ);
    }
  }
  for (let iz = 0; iz < NZ; iz++) {
    for (let ix = 0; ix < NX; ix++) {
      const a = iz * (NX + 1) + ix;
      const b = a + 1;
      const c = a + (NX + 1);
      const d = c + 1;
      idx.push(a, c, b, b, c, d);
    }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  geo.setIndex(idx);
  geo.computeVertexNormals();
  const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
    map: tex, transparent: true, roughness: 1, depthWrite: true,
  }));
  fieldMesh = mesh;
  fieldMat = mesh.material;
  mesh.receiveShadow = false;
  mesh.renderOrder = 2;
  scene.add(mesh);

  /* low 3D rice tufts, just tall enough to read as relief */
  const inField = (x, z) => {
    let inside = false;
    for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
      const xi = poly[i][0], zi = poly[i][1];
      const xj = poly[j][0], zj = poly[j][1];
      if (((zi > z) !== (zj > z)) && (x < (xj - xi) * (z - zi) / (zj - zi) + xi)) inside = !inside;
    }
    return inside;
  };

  const tpos = [], tcol = [], tidx = [];
  const V = (x, y, z, r, g, b) => {
    tpos.push(x, y, z); tcol.push(r, g, b);
    return tpos.length / 3 - 1;
  };
  const quad = (a, b, c, d) => { tidx.push(a, b, c, a, c, d); };

  /* green leaves: three tapered segments, slight outward arch */
  for (let b = 0; b < 8; b++) {
    const a = (b / 7) * TAU + 0.3 + (b % 2) * 0.12;
    const dx = Math.cos(a), dz = Math.sin(a);
    const h = 0.62 + ((b * 7) % 5) * 0.05;
    const bend = 0.12 + (b % 3) * 0.03;
    const w = 0.03;
    const lx = -dz, lz = dx;
    const rows = [
      [0, 0, w, 0.045, 0.16, 0.025],
      [bend * 0.45, h * 0.6, w * 0.8, 0.09, 0.28, 0.04],
      [bend, h, w * 0.15, 0.20, 0.44, 0.09],
    ];
    const ids = [];
    for (const r of rows) {
      ids.push(V(dx * r[0] + lx * r[2], r[1], dz * r[0] + lz * r[2], r[3], r[4], r[5]));
      ids.push(V(dx * r[0] - lx * r[2], r[1], dz * r[0] - lz * r[2], r[3], r[4], r[5]));
    }
    // rows: 0 base, 1 mid, 2 tip
    quad(ids[0], ids[2], ids[3], ids[1]);
    quad(ids[2], ids[4], ids[5], ids[3]);
  }

  /* golden panicles: two crossed tapered ribbons following a drooping arc */
  const pcols = [
    [0.42, 0.22, 0.03],
    [0.70, 0.42, 0.07],
    [0.86, 0.54, 0.10],
    [0.74, 0.43, 0.07],
    [0.50, 0.27, 0.04],
  ];
  for (let p = 0; p < 3; p++) {
    const a = (p / 3) * TAU + 1.1;
    const dx = Math.cos(a), dz = Math.sin(a);
    const rows = [
      [0.02, 0.56, 0.006],
      [0.09, 0.80, 0.024],
      [0.18, 0.82, 0.034],
      [0.27, 0.73, 0.024],
      [0.34, 0.61, 0.005],
    ];
    const lx = -dz, lz = dx;
    // horizontal ribbon
    const hIds = [];
    // vertical ribbon
    const vIds = [];
    for (let r = 0; r < rows.length; r++) {
      const off = rows[r][0], y = rows[r][1], w = rows[r][2];
      const c = pcols[r];
      const j = (Math.random() - 0.5) * 0.05;
      hIds.push(V(dx * off + lx * w, y, dz * off + lz * w, c[0] + j, c[1] + j, c[2] + j));
      hIds.push(V(dx * off - lx * w, y, dz * off - lz * w, c[0] + j, c[1] + j, c[2] + j));
      vIds.push(V(dx * off, y + w, dz * off, c[0] + j, c[1] + j, c[2] + j));
      vIds.push(V(dx * off, y - w, dz * off, c[0] + j, c[1] + j, c[2] + j));
    }
    for (let r = 0; r < rows.length - 1; r++) {
      quad(hIds[r * 2], hIds[r * 2 + 1], hIds[r * 2 + 3], hIds[r * 2 + 2]);
      quad(vIds[r * 2], vIds[r * 2 + 1], vIds[r * 2 + 3], vIds[r * 2 + 2]);
    }
  }

  const tuftGeo = new THREE.BufferGeometry();
  tuftGeo.setAttribute('position', new THREE.Float32BufferAttribute(tpos, 3));
  tuftGeo.setAttribute('color', new THREE.Float32BufferAttribute(tcol, 3));
  tuftGeo.setIndex(tidx);
  tuftGeo.computeVertexNormals();

  riceMat = new THREE.MeshStandardMaterial({
    color: 0xFFFFFF, roughness: 1, metalness: 0, side: THREE.DoubleSide, vertexColors: true,
    emissive: 0x4F4A18, emissiveIntensity: 0.18,
  });
  riceMat.onBeforeCompile = shader => {
    shader.uniforms.uTime = riceUniforms.uTime;
    shader.uniforms.uWind = riceUniforms.uWind;
    shader.uniforms.uWindStrength = riceUniforms.uWindStrength;
    shader.vertexShader = 'uniform float uTime;\nuniform vec2 uWind;\nuniform float uWindStrength;\n' + shader.vertexShader;
    shader.vertexShader = shader.vertexShader.replace(
      '#include <begin_vertex>',
      '#include <begin_vertex>\n' +
      '  float ph = instanceMatrix[3][0] * 0.7 + instanceMatrix[3][2] * 0.9;\n' +
      '  float hh = clamp(position.y / 0.9, 0.0, 1.0);\n' +
      '  float gustWave = sin(uTime * 2.0 - dot(instanceMatrix[3].xz, uWind) * 0.7 + ph * 0.25);\n' +
      '  transformed.x += (sin(uTime * 1.7 + ph) * 0.03 + uWind.x * 0.15 * (0.35 + uWindStrength) + uWind.x * gustWave * 0.045) * hh;\n' +
      '  transformed.z += (cos(uTime * 1.3 + ph) * 0.022 + uWind.y * 0.15 * (0.35 + uWindStrength) + uWind.y * gustWave * 0.045) * hh;'
    );
  };

  const COUNT = 3200;
  const inst = new THREE.InstancedMesh(tuftGeo, riceMat, COUNT);
  const dummy = new THREE.Object3D();
  const col = new THREE.Color();
  let placed = 0;
  let guard = 0;
  while (placed < COUNT && guard++ < COUNT * 10) {
    const x = x0 + Math.random() * (x1 - x0);
    const z = z0 + Math.random() * (z1 - z0);
    if (!inField(x, z)) continue;
    dummy.position.set(x, fieldY(x, z) + 0.012, z);
    dummy.rotation.y = Math.random() * TAU;
    const sc = 0.75 + Math.random() * 0.4;
    dummy.scale.set(sc, sc * (0.9 + Math.random() * 0.3), sc);
    dummy.updateMatrix();
    inst.setMatrixAt(placed, dummy.matrix);
    const tint = 0.88 + Math.random() * 0.16;
    col.setRGB(tint, tint * (0.97 + Math.random() * 0.05), tint * 0.9);
    inst.setColorAt(placed, col);
    placed++;
  }
  inst.count = placed;
  inst.instanceMatrix.needsUpdate = true;
  if (inst.instanceColor) inst.instanceColor.needsUpdate = true;
  inst.castShadow = false;
  inst.receiveShadow = false;
  scene.add(inst);

  /* white snow caps on the rice panicles, sharing the tuft transforms */
  const tipGeo = new THREE.SphereGeometry(0.115, 8, 6);
  tipGeo.scale(1, 0.48, 1);
  tipGeo.translate(0, 0.80, 0);
  snowTipMat = new THREE.MeshStandardMaterial({
    color: 0xF4FAFF, roughness: 1, metalness: 0,
    emissive: 0xAFC4D8, emissiveIntensity: 0.2,
    transparent: true, opacity: 0, depthWrite: false,
  });
  snowTipMat.onBeforeCompile = shader => {
    shader.uniforms.uTime = riceUniforms.uTime;
    shader.uniforms.uWind = riceUniforms.uWind;
    shader.uniforms.uWindStrength = riceUniforms.uWindStrength;
    shader.vertexShader = 'uniform float uTime;\nuniform vec2 uWind;\nuniform float uWindStrength;\n' + shader.vertexShader;
    shader.vertexShader = shader.vertexShader.replace(
      '#include <begin_vertex>',
      '#include <begin_vertex>\n' +
      '  float ph = instanceMatrix[3][0] * 0.7 + instanceMatrix[3][2] * 0.9;\n' +
      '  float hh = clamp(position.y / 0.9, 0.0, 1.0);\n' +
      '  float gustWave = sin(uTime * 2.0 - dot(instanceMatrix[3].xz, uWind) * 0.7 + ph * 0.25);\n' +
      '  transformed.x += (sin(uTime * 1.7 + ph) * 0.03 + uWind.x * 0.15 * (0.35 + uWindStrength)) * hh;\n' +
      '  transformed.z += (cos(uTime * 1.3 + ph) * 0.022 + uWind.y * 0.15 * (0.35 + uWindStrength)) * hh;'
    );
  };
  const tipM = new THREE.Matrix4();
  snowTips = new THREE.InstancedMesh(tipGeo, snowTipMat, inst.count);
  for (let i = 0; i < inst.count; i++) {
    inst.getMatrixAt(i, tipM);
    snowTips.setMatrixAt(i, tipM);
  }
  snowTips.instanceMatrix.needsUpdate = true;
  snowTips.count = inst.count;
  snowTips.visible = false;
  snowTips.castShadow = false;
  snowTips.receiveShadow = false;
  scene.add(snowTips);
}

const woolMat = new THREE.MeshStandardMaterial({ color: 0xFFFCF3, roughness: 1, metalness: 0 });
const darkMat = new THREE.MeshStandardMaterial({ color: 0x332E2B, roughness: 0.95, metalness: 0 });

const G = {
  body: new THREE.SphereGeometry(0.55, 22, 16),
  puff: new THREE.SphereGeometry(0.30, 16, 11),
  head: new THREE.SphereGeometry(0.27, 16, 12),
  snout: new THREE.SphereGeometry(0.12, 12, 8),
  ear: new THREE.SphereGeometry(0.1, 10, 7),
  leg: new THREE.CylinderGeometry(0.055, 0.045, 0.30, 7),
  tail: new THREE.SphereGeometry(0.1, 8, 6),
};

const PUFFS = [];
for (let i = 0; i < 14; i++) {
  const a = (i / 14) * TAU + (i % 2) * 0.24;
  const level = i % 3;
  const rad = 0.40 + (i % 4) * 0.03;
  const yOff = level === 0 ? -0.20 : level === 1 ? 0.08 : 0.42;
  PUFFS.push([
    Math.cos(a) * rad * 1.45,
    yOff + (i % 5) * 0.025,
    Math.sin(a) * rad * 1.2,
  ]);
}

const blobTex = makeBlobTexture();
let sheepSeq = 0;
const sheepList = [];
const LEG_SPOTS = [[0.3, 0.2], [0.3, -0.2], [-0.3, 0.2], [-0.3, -0.2]];
const SHEEP_SCALE = 1.25;
const JUMP_H = 0.5;

function buildSheep() {
  const root = new THREE.Group();
  root.userData.isSheep = true;
  root.userData.id = 'S' + (sheepSeq++);
  root.scale.setScalar(SHEEP_SCALE);

  const bob = new THREE.Group();
  root.add(bob);

  const body = new THREE.Group();
  body.position.y = 0.78;
  bob.add(body);

  const bodyMesh = new THREE.Mesh(G.body, woolMat);
  body.add(bodyMesh);
  for (const p of PUFFS) {
    const m = new THREE.Mesh(G.puff, woolMat);
    m.position.set(p[0], p[1], p[2]);
    body.add(m);
  }

  const neck = new THREE.Group();
  neck.position.set(0.62, 1.04, 0);
  bob.add(neck);

  const head = new THREE.Mesh(G.head, darkMat);
  head.position.set(0.34, 0.02, 0);
  neck.add(head);

  const snout = new THREE.Mesh(G.snout, darkMat);
  snout.position.set(0.54, -0.03, 0);
  neck.add(snout);

  for (const sz of [-1, 1]) {
    const ear = new THREE.Mesh(G.ear, darkMat);
    ear.position.set(0.24, 0.07, sz * 0.18);
    ear.scale.set(0.8, 0.4, 1.35);
    ear.rotation.x = sz * 0.38;
    neck.add(ear);
  }

  const legs = [];
  for (const spot of LEG_SPOTS) {
    const pivot = new THREE.Group();
    pivot.position.set(spot[0], 0.30, spot[1]);
    bob.add(pivot);
    const leg = new THREE.Mesh(G.leg, darkMat);
    leg.position.y = -0.15;
    pivot.add(leg);
    legs.push(pivot);
  }

  const tail = new THREE.Mesh(G.tail, woolMat);
  tail.position.set(-0.94, 0.86, 0);
  bob.add(tail);

  const blob = new THREE.Mesh(
    new THREE.PlaneGeometry(2.2, 1.7),
    new THREE.MeshBasicMaterial({
      map: blobTex, transparent: true, opacity: 0.34,
      depthWrite: false, color: 0x2E3A1E,
    })
  );
  blob.rotation.x = -Math.PI / 2;
  blob.position.y = 0.03;
  blob.renderOrder = 3;
  root.add(blob);

  root.traverse(o => {
    if (o.isMesh && o !== blob) { o.castShadow = true; o.receiveShadow = true; }
  });

  root.userData = Object.assign(root.userData, {
    bob: bob, body: body, neck: neck, legs: legs, tail: tail, blob: blob,
    state: 'idle',
    t: Math.random() * 3,
    phase: Math.random() * TAU,
    next: 4 + Math.random() * 5,
    hy: 0,
    sqY: 1,
    sqXZ: 1,
    tilt: 0,
    target: null,
    pop: 1,
    stepDist: 0,
    stepSide: 0,
  });

  return root;
}

const SHEEP_SPOTS = [
  [-12.0, -6.6], [-3.2, -8.7], [3.5, -10.3], [8.4, -6.2], [14.6, -10.6],
  [-8.0, 1.2], [-3.7, 2.6], [10.6, 1.6], [3.2, 5.8], [11.5, 12.3], [-6.6, 9.4],
];

function pickWalkTarget(s) {
  const u = s.userData;
  for (let i = 0; i < 90; i++) {
    const x = KEEP_X + Math.random() * (19.6 - KEEP_X);
    const z = -11.4 + Math.random() * 22.8;
    if (islandSDF(x, z, 2.6) > 0) continue;
    if (dist2(x, z, s.position.x, s.position.z) < 3.0) continue;
    let ok = true;
    for (const t of TREES) if (dist2(t[0], t[1], x, z) < 2.4) { ok = false; break; }
    if (ok && dist2(7.2, -0.6, x, z) < 1.4) ok = false;
    if (ok && x > 5.4 && x < 19.8 && z > 1.8 && z < 12.2) ok = false;
    if (ok) { u.target = { x: x, z: z }; return; }
  }
  u.target = { x: s.position.x, z: s.position.z };
}

function applyState(s, state) {
  const u = s.userData;
  u.state = state;
  u.t = 0;
  u.phase = 0;
  u.stepDist = 0;
  if (state === 'walk') pickWalkTarget(s);
  else u.target = null;
}

function placeSheep(s, x, z, rot) {
  s.position.set(x, terrainH(x, z), z);
  s.rotation.y = rot;
  scene.add(s);
  sheepList.push(s);
}

for (let i = 0; i < 11; i++) {
  const s = buildSheep();
  const sp = SHEEP_SPOTS[i];
  const facing = i === 0 ? Math.atan2(-(34.5 - sp[1]), 0 - sp[0]) : rnd() * TAU;
  placeSheep(s, sp[0], sp[1], facing);
  applyState(s, 'walk');
  s.userData.next = 20 + Math.random() * 10;
}

/* ============================================================
   9 · behaviour
   ============================================================ */
function updateSheep(s, dt, now) {
  const u = s.userData;

  if (s !== selected && u.state !== 'jump' && now > u.next) {
    const r = Math.random();
    applyState(s, r < 0.36 ? 'idle' : r < 0.7 ? 'graze' : 'walk');
    u.next = now + 4 + Math.random() * 5;
  }

  u.t += dt;

  let sqY = 1, sqXZ = 1, tilt = 0;
  let neckZ = 0, neckYaw = 0, neckDrop = 0;
  let bobY = 0;
  const legT = [0, 0, 0, 0];

  if (u.state === 'idle') {
    bobY = Math.sin(now * 1.5 + u.phase) * 0.018;
    neckZ = Math.sin(now * 0.45 + u.phase) * 0.12;
    neckYaw = Math.sin(now * 0.31 + u.phase * 1.7) * 0.16;
  } else if (u.state === 'graze') {
    bobY = Math.sin(now * 1.5 + u.phase) * 0.008;
    neckZ = -1.0 + Math.sin(now * 8.5 + u.phase) * 0.09;
    neckDrop = -0.16;
  } else if (u.state === 'walk') {
    if (!u.target) pickWalkTarget(s);
    const tgt = u.target;
    if (tgt) {
      const dx = tgt.x - s.position.x;
      const dz = tgt.z - s.position.z;
      const d = Math.hypot(dx, dz);
      if (d < 0.28) {
        u.state = 'idle';
        u.t = 0;
        u.target = null;
        u.next = now + 4 + Math.random() * 5;
      } else {
        const want = Math.atan2(-dz, dx);
        s.rotation.y = angleLerp(s.rotation.y, want, dmp(dt, 5.5));
        const fx = Math.cos(s.rotation.y);
        const fz = -Math.sin(s.rotation.y);
        let nx = s.position.x + fx * 1.15 * dt;
        let nz = s.position.z + fz * 1.15 * dt;
        nx = Math.max(nx, KEEP_X);
        if (islandSDF(nx, nz, 2.2) > 0) {
          u.target = null;
          pickWalkTarget(s);
        } else {
          s.position.set(nx, terrainH(nx, nz), nz);
          u.stepDist += 1.15 * dt;
          if (u.stepDist > 0.8) {
            u.stepDist = 0;
            u.stepSide = u.stepSide ? 0 : 1;
            const side = u.stepSide ? 1 : -1;
            const hx = Math.cos(s.rotation.y), hz = -Math.sin(s.rotation.y);
            const sx = -hz, sz = hx;
            spawnFootprint(
              s.position.x - hx * 0.16 + sx * 0.18 * side,
              s.position.z - hz * 0.16 + sz * 0.18 * side,
              s.rotation.y
            );
          }
          u.phase += dt * 8;
          bobY = Math.abs(Math.sin(u.phase)) * 0.028;
          const sw = Math.sin(u.phase) * 0.5;
          legT[0] = sw; legT[1] = -sw; legT[2] = -sw; legT[3] = sw;
        }
      }
    }
  } else if (u.state === 'jump') {
    const T = u.t;
    if (T < 0.18) {
      const k = easeOut(clamp(T / 0.18, 0, 1));
      sqY = lerp(1, 0.80, k);
      sqXZ = lerp(1, 1.10, k);
      neckZ = -0.34 * k;
      u.hy = 0;
    } else if (T < 0.64) {
      const p = (T - 0.18) / 0.46;
      const e = Math.min(1, p / 0.14);
      u.hy = JUMP_H * 4 * p * (1 - p);
      sqY = 1.13;
      sqXZ = 0.93;
      neckZ = -0.16 * e;
      legT[0] = legT[1] = 1.30 * e;
      legT[2] = legT[3] = -1.20 * e;
      tilt = 0.18 * e;
    } else if (T < 0.82) {
      const p = clamp((T - 0.64) / 0.18, 0, 1);
      u.hy = 0;
      sqY = 0.80;
      sqXZ = 1.10;
      tilt = 0.18 * (1 - p);
      legT[0] = legT[1] = 1.30 * (1 - p);
      legT[2] = legT[3] = -1.20 * (1 - p);
    } else {
      u.state = 'idle';
      u.t = 0;
      u.hy = 0;
      u.next = now + 4 + Math.random() * 5;
    }
  }

  u.sqY = lerp(u.sqY, sqY, dmp(dt, 20));
  u.sqXZ = lerp(u.sqXZ, sqXZ, dmp(dt, 20));
  u.body.scale.set(u.sqXZ, u.sqY, u.sqXZ);

  u.tilt = lerp(u.tilt, tilt, dmp(dt, 20));
  u.bob.rotation.z = -u.tilt;

  if (u.state !== 'jump') u.hy = lerp(u.hy, 0, dmp(dt, 10));
  u.bob.position.y = bobY + u.hy;

  u.neck.rotation.z = lerp(u.neck.rotation.z, neckZ, dmp(dt, 12));
  u.neck.rotation.y = lerp(u.neck.rotation.y, neckYaw, dmp(dt, 10));
  u.neck.position.y = lerp(u.neck.position.y, 1.04 + neckDrop, dmp(dt, 12));

  for (let i = 0; i < 4; i++) {
    u.legs[i].rotation.z = lerp(u.legs[i].rotation.z, legT[i], dmp(dt, 22));
  }

  if (u.blob) {
    const k = clamp(1 - u.hy * 1.25, 0.45, 1);
    u.blob.scale.set(k, k, 1);
    u.blob.material.opacity = 0.34 * k;
  }

  if (u.pop < 1) {
    u.pop = Math.min(1, u.pop + (1 - u.pop) * dmp(dt, 10));
    s.scale.setScalar(SHEEP_SCALE * u.pop);
  }
}

const $ = id => document.getElementById(id);
const boxEl = $('box');
const labelEl = $('label');
const toolbarEl = $('toolbar');
const undoBtn = $('btn-undo');
const redoBtn = $('btn-redo');

const overlay = $('overlay');
const handles = [];
for (let i = 0; i < 8; i++) {
  const d = document.createElement('div');
  d.className = 'handle';
  overlay.appendChild(d);
  handles.push(d);
}
const HANDLE_POS = [[0, 0], [0.5, 0], [1, 0], [1, 0.5], [1, 1], [0.5, 1], [0, 1], [0, 0.5]];

let selected = null;
let selectedBoxScreen = null;
let time = 0;
let labelCache = { text: '', w: 0, h: 0 };
let toolbarSize = { w: 0, h: 0 };

const _box = new THREE.Box3();
const _c = new THREE.Vector3();
const _v = new THREE.Vector3();

const history = [];
let hIdx = -1;

function refreshHistoryUI() {
  undoBtn.disabled = hIdx < 0;
  redoBtn.disabled = hIdx >= history.length - 1;
}

function commit(cmd) {
  history.length = hIdx + 1;
  history.push(cmd);
  hIdx = history.length - 1;
  refreshHistoryUI();
}

function doUndo() {
  if (hIdx < 0) return;
  history[hIdx].undo();
  hIdx--;
  refreshHistoryUI();
}

function doRedo() {
  if (hIdx >= history.length - 1) return;
  hIdx++;
  history[hIdx].redo();
  refreshHistoryUI();
}

function hideSelectionUI() {
  boxEl.style.display = 'none';
  labelEl.style.display = 'none';
  toolbarEl.style.display = 'none';
  for (const h of handles) h.style.display = 'none';
  selectedBoxScreen = null;
}

function select(s) {
  if (selected === s) return;
  if (selected) selected.userData.next = time + 2 + Math.random() * 4;
  selected = s;
  if (s) {
    s.userData.next = Infinity;
    if (s.userData.state !== 'jump') applyState(s, 'walk');
    const st = s.userData.state;
    for (const b of document.querySelectorAll('.beh')) {
      b.classList.toggle('active', b.dataset.state === st);
    }
  } else {
    hideSelectionUI();
  }
}

function setSheepState(s, state, record) {
  if (!s) return;
  const u = s.userData;
  const prev = u.state;
  applyState(s, state);
  u.next = Infinity;
  if (record !== false && prev !== state) {
    commit({
      undo: () => { if (sheepList.includes(s)) applyState(s, prev); },
      redo: () => { if (sheepList.includes(s)) applyState(s, state); },
    });
  }
}

function findFreeSpot(x, z) {
  for (let i = 0; i < 40; i++) {
    const a = Math.random() * TAU;
    const r = 1.7 + Math.random() * 1.3;
    const nx = x + Math.cos(a) * r;
    const nz = z + Math.sin(a) * r;
    if (islandSDF(nx, nz, 2.4) > 0) continue;
    if (nx < KEEP_X) continue;
    if (nx > 5.4 && nx < 19.8 && nz > 1.8 && nz < 12.2) continue;
    let ok = true;
    for (const s of sheepList) {
      if (dist2(s.position.x, s.position.z, nx, nz) < 1.6) { ok = false; break; }
    }
    if (ok) return { x: nx, z: nz };
  }
  return { x: clamp(x + 1.8, KEEP_X, 19.6), z: z };
}

function duplicateSelected() {
  if (!selected) return;
  const src = selected;
  const spot = findFreeSpot(src.position.x, src.position.z);
  const clone = buildSheep();
  clone.position.set(spot.x, terrainH(spot.x, spot.z), spot.z);
  clone.rotation.y = Math.random() * TAU;
  applyState(clone, src.userData.state === 'jump' ? 'idle' : src.userData.state);
  clone.userData.next = Infinity;
  scene.add(clone);
  sheepList.push(clone);

  const remove = () => {
    scene.remove(clone);
    const i = sheepList.indexOf(clone);
    if (i >= 0) sheepList.splice(i, 1);
    if (selected === clone) select(null);
  };
  const add = () => {
    if (!sheepList.includes(clone)) sheepList.push(clone);
    scene.add(clone);
  };
  commit({ undo: remove, redo: add });
  select(clone);
}

function deleteSelected() {
  if (!selected) return;
  const s = selected;
  const idx = sheepList.indexOf(s);
  scene.remove(s);
  if (idx >= 0) sheepList.splice(idx, 1);
  select(null);
  const add = () => {
    if (!sheepList.includes(s)) sheepList.splice(Math.min(idx, sheepList.length), 0, s);
    scene.add(s);
  };
  const remove = () => {
    scene.remove(s);
    const i = sheepList.indexOf(s);
    if (i >= 0) sheepList.splice(i, 1);
    if (selected === s) select(null);
  };
  commit({ undo: add, redo: remove });
}

function updateSelectionUI() {
  if (!selected) { hideSelectionUI(); return; }

  _box.setFromObject(selected);
  if (_box.isEmpty()) { hideSelectionUI(); return; }

  const wWorld = _box.max.x - _box.min.x;
  const hWorld = _box.max.y - _box.min.y;
  _box.getCenter(_c);
  const dist = camera.position.distanceTo(_c);

  const W = window.innerWidth;
  const H = window.innerHeight;
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  let behind = false;

  for (let i = 0; i < 8; i++) {
    _v.set(
      (i & 1) ? _box.max.x : _box.min.x,
      (i & 2) ? _box.max.y : _box.min.y,
      (i & 4) ? _box.max.z : _box.min.z
    );
    _v.project(camera);
    if (_v.z > 1) behind = true;
    const sx = (_v.x * 0.5 + 0.5) * W;
    const sy = (-_v.y * 0.5 + 0.5) * H;
    if (sx < minX) minX = sx;
    if (sx > maxX) maxX = sx;
    if (sy < minY) minY = sy;
    if (sy > maxY) maxY = sy;
  }
  if (behind || !isFinite(minX)) { hideSelectionUI(); return; }

  const bw = Math.max(2, maxX - minX);
  const bh = Math.max(2, maxY - minY);
  selectedBoxScreen = { x0: minX, y0: minY, x1: maxX, y1: maxY };

  boxEl.style.display = 'block';
  boxEl.style.left = minX + 'px';
  boxEl.style.top = minY + 'px';
  boxEl.style.width = bw + 'px';
  boxEl.style.height = bh + 'px';

  for (let i = 0; i < 8; i++) {
    const h = handles[i];
    h.style.display = 'block';
    h.style.left = (minX + HANDLE_POS[i][0] * bw) + 'px';
    h.style.top = (minY + HANDLE_POS[i][1] * bh) + 'px';
  }

  const text = wWorld.toFixed(2) + ' \u00D7 ' + hWorld.toFixed(2) + ' 米 \u00B7 距离 ' + Math.round(dist) + ' 米';
  labelEl.style.display = 'block';
  if (labelCache.text !== text) {
    labelEl.textContent = text;
    labelCache.text = text;
    labelCache.w = labelEl.offsetWidth;
    labelCache.h = labelEl.offsetHeight;
  }

  const lw = labelCache.w || labelEl.offsetWidth;
  const lh = labelCache.h || labelEl.offsetHeight;
  const lcx = clamp(minX + bw / 2, lw / 2 + 10, W - lw / 2 - 10);
  const lTop = clamp(maxY + 8, 10, Math.max(10, H - lh - 10));
  labelEl.style.left = lcx + 'px';
  labelEl.style.top = lTop + 'px';

  toolbarEl.style.display = 'flex';
  if (!toolbarSize.w) {
    toolbarSize.w = toolbarEl.offsetWidth;
    toolbarSize.h = toolbarEl.offsetHeight;
  }
  const tw = toolbarSize.w;
  const th = toolbarSize.h;
  const tLeft = clamp(minX + bw / 2 - tw / 2, 10, Math.max(10, W - tw - 10));
  let tTop = lTop + lh + 6;
  if (tTop + th + 10 > H) tTop = minY - th - 8;
  tTop = clamp(tTop, 10, Math.max(10, H - th - 10));
  toolbarEl.style.left = tLeft + 'px';
  toolbarEl.style.top = tTop + 'px';

  const st = selected.userData.state;
  for (const b of document.querySelectorAll('.beh')) {
    b.classList.toggle('active', b.dataset.state === st);
  }
}

const raycaster = new THREE.Raycaster();
const pointerNdc = new THREE.Vector2();
let press = null;

function pickSheep(clientX, clientY) {
  const rect = renderer.domElement.getBoundingClientRect();
  pointerNdc.x = ((clientX - rect.left) / rect.width) * 2 - 1;
  pointerNdc.y = -((clientY - rect.top) / rect.height) * 2 + 1;
  camera.updateMatrixWorld();
  raycaster.setFromCamera(pointerNdc, camera);
  const hits = raycaster.intersectObjects(sheepList, true);
  for (const hit of hits) {
    let o = hit.object;
    while (o) {
      if (o.userData && o.userData.isSheep) return o;
      o = o.parent;
    }
  }
  return null;
}

/* --- direct manipulation: drag a selected box, or lasso-spawn --- */
const lassoCanvas = document.getElementById('lasso');
const lctx = lassoCanvas.getContext('2d');
const groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
const _ground = new THREE.Vector3();
let dragMode = null;
let dragSheep = null;
let dragStartPos = null;
let dragStart = null;
let dragOffset = { x: 0, z: 0 };
let dragMoved = false;
let lassoPts = [];

let lassoW = 0, lassoH = 0;
function sizeLasso() {
  lassoW = lassoCanvas.clientWidth || window.innerWidth;
  lassoH = lassoCanvas.clientHeight || window.innerHeight;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  lassoCanvas.width = Math.floor(lassoW * dpr);
  lassoCanvas.height = Math.floor(lassoH * dpr);
  lctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
sizeLasso();
window.addEventListener('resize', sizeLasso);

function groundPoint(clientX, clientY) {
  const rect = renderer.domElement.getBoundingClientRect();
  const nx = ((clientX - rect.left) / rect.width) * 2 - 1;
  const ny = -((clientY - rect.top) / rect.height) * 2 + 1;
  camera.updateMatrixWorld();
  raycaster.setFromCamera(new THREE.Vector2(nx, ny), camera);
  if (!raycaster.ray.intersectPlane(groundPlane, _ground)) return null;
  return { x: _ground.x, z: _ground.z };
}

function insideBox(px, py) {
  if (!selectedBoxScreen) return false;
  return px >= selectedBoxScreen.x0 - 3 && px <= selectedBoxScreen.x1 + 3 &&
         py >= selectedBoxScreen.y0 - 3 && py <= selectedBoxScreen.y1 + 3;
}

function drawLasso() {
  lctx.clearRect(0, 0, lassoW, lassoH);
  if (!lassoPts.length) return;
  if (lassoPts.length < 2) {
    lctx.beginPath();
    lctx.arc(lassoPts[0][0], lassoPts[0][1], 5, 0, TAU);
    lctx.strokeStyle = 'rgba(46,124,246,0.9)';
    lctx.lineWidth = 1.5;
    lctx.stroke();
    return;
  }
  lctx.beginPath();
  lctx.moveTo(lassoPts[0][0], lassoPts[0][1]);
  for (let i = 1; i < lassoPts.length; i++) lctx.lineTo(lassoPts[i][0], lassoPts[i][1]);
  lctx.closePath();
  lctx.fillStyle = 'rgba(46,124,246,0.06)';
  lctx.fill();
  lctx.setLineDash([6, 5]);
  lctx.strokeStyle = 'rgba(46,124,246,0.88)';
  lctx.lineWidth = 1.5;
  lctx.stroke();
  lctx.setLineDash([]);
}

function startSheepDrag(x, y) {
  dragMode = 'sheep';
  dragSheep = selected;
  dragStartPos = selected.position.clone();
  dragStart = { x, y };
  dragMoved = false;
  press = null;
  const g0 = groundPoint(x, y);
  dragOffset = g0 ? { x: selected.position.x - g0.x, z: selected.position.z - g0.z } : { x: 0, z: 0 };
  controls.enableRotate = false;
  controls.enableZoom = false;
  if (selected.userData.state === 'walk') {
    selected.userData.state = 'idle';
    selected.userData.t = 0;
    selected.userData.target = null;
  }
  renderer.domElement.style.cursor = 'grabbing';
}

function moveSheepDrag(x, y) {
  if (!dragSheep) return;
  const g = groundPoint(x, y);
  if (!g) return;
  if (Math.hypot(x - dragStart.x, y - dragStart.y) > 2) dragMoved = true;
  let nx = g.x + dragOffset.x;
  let nz = g.z + dragOffset.z;
  if (nx < KEEP_X + 0.2) nx = KEEP_X + 0.2;
  if (islandSDF(nx, nz, 1.2) > 0) return;
  dragSheep.position.set(nx, terrainH(nx, nz), nz);
}

function finishSheepDrag() {
  if (dragSheep && dragMoved) {
    const sh = dragSheep;
    const from = dragStartPos;
    const to = sh.position.clone();
    commit({
      undo: () => { sh.position.set(from.x, terrainH(from.x, from.z), from.z); },
      redo: () => { sh.position.set(to.x, terrainH(to.x, to.z), to.z); },
    });
  }
  dragSheep = null;
  dragStartPos = null;
  dragStart = null;
  dragMode = null;
  controls.enableRotate = true;
  controls.enableZoom = true;
  renderer.domElement.style.cursor = 'default';
}

function pointInPoly(x, z, poly) {
  let inside = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const xi = poly[i].x, zi = poly[i].z;
    const xj = poly[j].x, zj = poly[j].z;
    if (((zi > z) !== (zj > z)) && (x < (xj - xi) * (z - zi) / (zj - zi) + xi)) inside = !inside;
  }
  return inside;
}

function spawnSheepAt(x, z) {
  const sh = buildSheep();
  sh.userData.pop = 0.55;
  sh.scale.setScalar(SHEEP_SCALE * 0.55);
  placeSheep(sh, x, z, Math.random() * TAU);
  applyState(sh, 'walk');
  sh.userData.next = Infinity;
  const add = () => { if (!sheepList.includes(sh)) sheepList.push(sh); scene.add(sh); };
  const remove = () => {
    scene.remove(sh);
    const i = sheepList.indexOf(sh);
    if (i >= 0) sheepList.splice(i, 1);
    if (selected === sh) select(null);
  };
  commit({ undo: remove, redo: add });
  select(sh);
}

function finishLasso(upX, upY) {
  const pts = lassoPts;
  lassoPts = [];
  dragMode = null;
  controls.enableRotate = true;
  controls.enableZoom = true;
  renderer.domElement.style.cursor = 'default';
  setTimeout(() => { lctx.clearRect(0, 0, lassoW, lassoH); }, 220);

  if (pts.length < 3) {
    select(pickSheep(upX, upY));
    return;
  }

  const wp = [];
  for (const pt of pts) {
    const gp = groundPoint(pt[0], pt[1]);
    if (gp) wp.push(gp);
  }
  if (wp.length < 4) return;

  let area = 0;
  for (let i = 0; i < wp.length; i++) {
    const a = wp[i], b = wp[(i + 1) % wp.length];
    area += a.x * b.z - b.x * a.z;
  }
  area = Math.abs(area) * 0.5;
  if (area < 1.0) return;

  let cx = 0, cz = 0;
  for (const pt of wp) { cx += pt.x; cz += pt.z; }
  cx /= wp.length;
  cz /= wp.length;

  const freeSpot = (x, z) => {
    for (const sh of sheepList) if (dist2(sh.position.x, sh.position.z, x, z) < 1.25) return false;
    for (const t of TREES) if (dist2(t[0], t[1], x, z) < 1.7) return false;
    return true;
  };
  let target = null;
  if (islandSDF(cx, cz, 1.5) < 0 && cx > KEEP_X + 0.8 && freeSpot(cx, cz)) target = { x: cx, z: cz };
  if (!target) {
    const xs = wp.map(pt => pt.x), zs = wp.map(pt => pt.z);
    const minX = Math.min.apply(null, xs), maxX = Math.max.apply(null, xs);
    const minZ = Math.min.apply(null, zs), maxZ = Math.max.apply(null, zs);
    let best = Infinity;
    for (let i = 0; i < 40; i++) {
      for (let j = 0; j < 40; j++) {
        const x = minX + (maxX - minX) * (i + 0.5) / 40;
        const z = minZ + (maxZ - minZ) * (j + 0.5) / 40;
        if (!pointInPoly(x, z, wp)) continue;
        if (islandSDF(x, z, 1.5) >= 0 || x < KEEP_X + 0.8) continue;
        if (!freeSpot(x, z)) continue;
        const d = (x - cx) * (x - cx) + (z - cz) * (z - cz);
        if (d < best) { best = d; target = { x: x, z: z }; }
      }
    }
  }
  if (!target && islandSDF(cx, cz, 1.5) < 0 && cx > KEEP_X + 0.8) target = { x: cx, z: cz };
  if (!target) return;
  spawnSheepAt(target.x, target.z);
}

renderer.domElement.addEventListener('pointerdown', e => {
  if (e.button !== 0) return;
  const sheepHit = pickSheep(e.clientX, e.clientY);
  if (selected && insideBox(e.clientX, e.clientY)) {
    startSheepDrag(e.clientX, e.clientY);
    return;
  }
  const gp = groundPoint(e.clientX, e.clientY);
  if (gp && !sheepHit && islandSDF(gp.x, gp.z, 0.15) < 0) {
    dragMode = 'lasso';
    lassoPts = [[e.clientX, e.clientY]];
    press = null;
    controls.enableRotate = false;
    controls.enableZoom = false;
    renderer.domElement.style.cursor = 'crosshair';
    drawLasso();
    return;
  }
  press = { x: e.clientX, y: e.clientY, t: performance.now() };
});

renderer.domElement.addEventListener('pointerup', e => {
  if (!press || e.button !== 0) { press = null; return; }
  const moved = Math.hypot(e.clientX - press.x, e.clientY - press.y);
  const held = performance.now() - press.t;
  press = null;
  if (moved >= 5 || held >= 400) return;
  select(pickSheep(e.clientX, e.clientY));
});

renderer.domElement.addEventListener('pointercancel', () => { press = null; });
renderer.domElement.addEventListener('contextmenu', e => e.preventDefault());

window.addEventListener('pointermove', e => {
  if (dragMode === 'sheep') moveSheepDrag(e.clientX, e.clientY);
  else if (dragMode === 'lasso') {
    const last = lassoPts[lassoPts.length - 1];
    if (Math.hypot(e.clientX - last[0], e.clientY - last[1]) > 2) {
      lassoPts.push([e.clientX, e.clientY]);
      drawLasso();
    }
  }
}, { passive: true });

window.addEventListener('pointerup', e => {
  if (e.button !== 0) return;
  if (dragMode === 'sheep') finishSheepDrag();
  else if (dragMode === 'lasso') finishLasso(e.clientX, e.clientY);
});

window.addEventListener('pointercancel', () => {
  if (dragMode === 'sheep') finishSheepDrag();
  else if (dragMode === 'lasso') {
    lassoPts = [];
    dragMode = null;
    controls.enableRotate = true;
    controls.enableZoom = true;
    lctx.clearRect(0, 0, lassoW, lassoH);
  }
});

let hoverAt = 0;
renderer.domElement.addEventListener('pointermove', e => {
  if (dragMode) return;
  const now = performance.now();
  if (now - hoverAt < 60) return;
  hoverAt = now;
  let cursor = 'default';
  if (selected && insideBox(e.clientX, e.clientY)) cursor = 'move';
  else if (pickSheep(e.clientX, e.clientY)) cursor = 'pointer';
  else {
    const gp = groundPoint(e.clientX, e.clientY);
    if (gp && islandSDF(gp.x, gp.z, 0.15) < 0) cursor = 'crosshair';
  }
  renderer.domElement.style.cursor = cursor;
});

  bgTex.needsUpdate = true;
}

function updateTimeWeather(dt) {
  if (!scrubbing) timeOfDay = (timeOfDay + dt * 24 / DAY_SECONDS) % 24;

  const rainTarget = weatherTarget === 1 ? 1 : 0;
  const snowTarget = weatherTarget === 2 ? 1 : 0;
  rainAmount += (rainTarget - rainAmount) * dmp(dt, 1.6);
  snowAmount += (snowTarget - snowAmount) * dmp(dt, 0.7);
  if (rainTarget === 0 && rainAmount < 0.002) rainAmount = 0;
  if (rainTarget === 1 && rainAmount > 0.998) rainAmount = 1;
  if (snowTarget === 0 && snowAmount < 0.002) snowAmount = 0;
  if (snowTarget === 1 && snowAmount > 0.998) snowAmount = 1;
  wetness += (rainAmount - wetness) * dmp(dt, rainAmount > wetness ? 1.0 : 0.15);
  freeze += (snowAmount - freeze) * dmp(dt, snowAmount > freeze ? 0.45 : 0.1);

  const t = timeOfDay;
  const { A, B, f } = envSample(t);
  cSky.copy(A.skyC).lerp(B.skyC, f);
  cSun.copy(A.sunC).lerp(B.sunC, f);
  cHemiSky.copy(A.hemiSkyC).lerp(B.hemiSkyC, f);
  cHemiGround.copy(A.hemiGroundC).lerp(B.hemiGroundC, f);
  cCloud.copy(A.cloudC).lerp(B.cloudC, f);
  cWater.copy(A.waterC).lerp(B.waterC, f);
  let sunI = lerp(A.sunI, B.sunI, f);
  let hemiI = lerp(A.hemiI, B.hemiI, f);
  let ambI = lerp(A.ambI, B.ambI, f);
  const sunUp = clamp((t - 6) / 12, 0, 1);
  const rainMix = rainAmount;
  const snowMix = snowAmount;

  cSky.lerp(RAIN_SKY, rainMix * 0.65);
  cSun.lerp(RAIN_SUN, rainMix * 0.6);
  cCloud.lerp(RAIN_CLOUD, rainMix * 0.85);
  cWater.lerp(RAIN_WATER, rainMix * 0.7);
  sunI *= (1 - rainMix * 0.72);
  hemiI *= (1 - rainMix * 0.30);
  ambI = lerp(ambI, 0.34, rainMix * 0.5);

  const snowSky = sunUp > 0.2 ? SNOW_SKY : SNOW_SKY_NIGHT;
  cSky.lerp(snowSky, snowMix * 0.75);
  cSun.lerp(SNOW_SUN, snowMix * 0.65);
  cCloud.lerp(SNOW_CLOUD, snowMix * 0.85);
  cWater.lerp(SNOW_WATER, snowMix * 0.7);
  sunI *= (1 - snowMix * 0.55);
  hemiI *= (1 - snowMix * 0.15);
  ambI = lerp(ambI, 0.32, snowMix * 0.3);

  const dayMask = sstep(5.6, 7.2, t) * (1 - sstep(16.8, 18.8, t));
  const dayT = clamp((t - 6) / 12, 0, 1);
  const sunAng = dayT * Math.PI;
  sunSprite.position.set(Math.cos(sunAng) * 10, 3.0 + Math.sin(sunAng) * 0.5, -18);
  sunSprite.material.opacity = dayMask * (1 - rainMix) * (1 - snowMix * 0.25);
  sunSprite.visible = sunSprite.material.opacity > 0.01;
  const nightT = t >= 18 ? t - 18 : t + 6;
  const moonAng = (nightT / 12) * Math.PI;
  moonSprite.position.set(Math.cos(moonAng) * 9, 2.8 + Math.sin(moonAng) * 0.4, -20);
  moonSprite.material.opacity = (1 - dayMask) * 0.95 * (1 - rainMix) * (1 - snowMix * 0.35);
  moonSprite.visible = moonSprite.material.opacity > 0.01;
  bgTimer -= dt;
  if (bgTimer <= 0) { bgTimer = 0.1; drawSkyBackground(t, rainMix, snowMix); }
  sun.color.copy(cSun);
  sun.intensity = sunI;
  if (t >= 6 && t <= 18) {
    const ang = ((t - 6) / 12) * Math.PI;
    sun.position.set(Math.cos(ang) * 30, 6 + Math.sin(ang) * 30, -12);
  } else {
    sun.position.set(14, 26, -18);
  }
  hemi.color.copy(cHemiSky);
  hemi.groundColor.copy(cHemiGround);
  hemi.intensity = hemiI;
  ambient.intensity = ambI;
  renderer.toneMappingExposure = 1.06 - (1 - sunUp) * 0.06 - rainMix * 0.12 - snowMix * 0.06;



  cCloudEm.copy(cCloud).lerp(WHITE, 0.45);
  cloudWhite.color.copy(cCloud);
  cloudWhite.emissive.copy(cCloudEm);
  cloudWhite.emissiveIntensity = 0.38 * (1 - rainMix * 0.7) * (1 - snowMix * 0.2);
  cloudShade.color.copy(cCloud).multiplyScalar(0.93);
  cloudShade.emissive.copy(cCloudEm).multiplyScalar(0.92);
  cloudShade.emissiveIntensity = 0.3 * (1 - rainMix * 0.7) * (1 - snowMix * 0.2);

  waterUniforms.uDayTint.value.copy(cWater);
  waterUniforms.uFreeze.value = freeze;
  rainVeilEl.style.opacity = (rainAmount * 0.9).toFixed(3);

  const wet = wetness * (1 - snowMix * 0.6);
  grassMesh.material.color.setRGB(1 - 0.30 * wet, 1 - 0.24 * wet, 1 - 0.32 * wet);
  grassMesh.material.roughness = 1 - 0.42 * wet;
  leafMat.color.setHex(0x548F2C).multiplyScalar(1 - 0.35 * wet).lerp(WHITE, snowMix * 0.22);
  leafMat2.color.setHex(0x64A03A).multiplyScalar(1 - 0.35 * wet).lerp(WHITE, snowMix * 0.22);
  purpleMat.color.setHex(0xC489C0).multiplyScalar(1 - 0.24 * wet).lerp(WHITE, snowMix * 0.2);
  trunkMat.color.setHex(0x8A5A34).multiplyScalar(1 - 0.4 * wet);
  rockMat.color.setHex(0xA8A49A).multiplyScalar(1 - 0.32 * wet).lerp(WHITE, snowMix * 0.35);
  woolMat.color.setHex(0xFFFCF3).multiplyScalar(1 - 0.2 * wet).lerp(SNOW_WOOL, snowMix * 0.35);
  woolMat.roughness = 1 - 0.3 * wet;
  darkMat.color.setHex(0x332E2B).multiplyScalar(1 - 0.12 * wet);
  roadMeshes.forEach((m, idx) => {
    m.material.color.setHex(idx === 0 ? 0xEFE1BE : 0xE6CE9B).multiplyScalar(1 - 0.32 * wet).lerp(WHITE, snowMix * 0.35);
    m.material.emissive.setHex(0xEAF4FB);
    m.material.emissiveIntensity = snowMix * 0.55 * (0.5 + 0.5 * sunUp);
  });
  fieldMat.color.setRGB(1 - 0.28 * wet, 1 - 0.28 * wet, 1 - 0.2 * wet);
  fieldMat.emissive.setHex(0xE8F2FA);
  const snowLit = 0.35 + 0.65 * sunUp;
  fieldMat.emissiveIntensity = snowMix * 0.08 * snowLit;
  riceMat.color.setRGB(1 - 0.28 * wet, 1 - 0.28 * wet, 1 - 0.2 * wet);
  riceMat.emissive.setHex(0xDDEBF6);
  riceMat.emissiveIntensity = snowMix * 0.12 * snowLit;

  const snowOn = snowMix > 0.002;
  snowGround.visible = snowOn;
  snowMounds.visible = snowOn;
  snowPoints.visible = snowOn;
  fieldSnow.visible = snowOn;
  snowCapMat.opacity = snowMix * 0.9;
  snowTips.visible = snowOn;
  if (snowOn) {
    snowMat.opacity = snowMix * 0.95;
    moundMat.opacity = snowMix * 0.9;
    flakeMat.opacity = snowMix * 0.85;
    fieldSnowMat.opacity = snowMix * 0.95;
    fieldSnowMat.emissiveIntensity = 0.22 * snowLit;
    snowTipMat.opacity = snowMix * 0.85;
    snowTipMat.emissiveIntensity = 0.2 * snowLit;
  }

  if (rainAmount > 0.01) {
    rain.visible = true;
    rainMat.opacity = rainAmount * 0.7;
    for (let i = 0; i < RAIN_N; i++) {
      const d = rainDrops[i];
      d.y -= d.speed * dt;
      d.x += wind.x * dt * 2.0;
      d.z += wind.z * dt * 2.0;
      if (d.y < -0.3 || d.x < -24 || d.x > 24 || d.z < -16 || d.z > 16) {
        d.x = -23 + Math.random() * 46;
        d.z = -15 + Math.random() * 30;
        d.y = 18 + Math.random() * 10;
        d.speed = 9 + Math.random() * 7;
      }
      const j = i * 6;
      rainPositions[j] = d.x;
      rainPositions[j + 1] = d.y;
      rainPositions[j + 2] = d.z;
      rainPositions[j + 3] = d.x - wind.x * 0.18;
      rainPositions[j + 4] = d.y - 0.95;
      rainPositions[j + 5] = d.z - wind.z * 0.18;
    }
    rainGeo.attributes.position.needsUpdate = true;
  } else {
    rain.visible = false;
  }

  if (snowOn) {
    for (let i = 0; i < SNOW_N; i++) {
      const d = flakes[i];
      d.y -= d.speed * dt;
      d.x += (wind.x * 0.8 + Math.sin(time * 1.4 + d.phase) * 0.15) * dt;
      d.z += (wind.z * 0.8 + Math.cos(time * 1.1 + d.phase) * 0.08) * dt;
      if (d.y < 0.1 || d.x < -24 || d.x > 24 || d.z < -16 || d.z > 16) {
        d.x = -23 + Math.random() * 46;
        d.z = -15 + Math.random() * 30;
        d.y = 16 + Math.random() * 12;
        d.speed = 1.2 + Math.random() * 1.5;
      }
      const j = i * 3;
      flakePositions[j] = d.x;
      flakePositions[j + 1] = d.y;
      flakePositions[j + 2] = d.z;
    }
    flakeGeo.attributes.position.needsUpdate = true;
  }

  {
    const style = cSky.getStyle();
    const nums = style.match(/\d+/g) || [255, 252, 246];
    const n0 = parseInt(nums[0], 10) || 255;
    const n1 = parseInt(nums[1], 10) || 252;
    const n2 = parseInt(nums[2], 10) || 246;
    const lum = 0.2126 * cSky.r + 0.7152 * cSky.g + 0.0722 * cSky.b;
    const dark = lum < 0.2;
    const root = document.body.style;
    root.setProperty('--env-bg', 'rgba(' + n0 + ',' + n1 + ',' + n2 + ',' + (dark ? 0.42 : 0.4) + ')');
    root.setProperty('--env-line', dark ? 'rgba(255,255,255,.22)' : 'rgba(90,80,60,.18)');
    root.setProperty('--env-ink', dark ? '#E9E4D8' : '#4A463E');
    root.setProperty('--env-strong', dark ? '#FFF9EE' : '#2C2A26');
    root.setProperty('--env-muted', dark ? '#B9B2A4' : '#8F8777');
    root.setProperty('--env-hover', dark ? 'rgba(255,255,255,.12)' : 'rgba(60,50,30,.06)');
    root.setProperty('--env-active', dark ? '#EFE7D8' : '#2E2A24');
    root.setProperty('--env-active-ink', dark ? '#2A2620' : '#FFF9EF');
  }

  const hour = Math.floor(t);
  const minute = Math.floor((t - hour) * 60);
  const clockText = String(hour).padStart(2, '0') + ':' + String(minute).padStart(2, '0');
  if (clockEl.textContent !== clockText) clockEl.textContent = clockText;
  const ph = phaseName(t);
  if (phaseEl.textContent !== ph) {
    phaseEl.textContent = ph;
    document.body.dataset.phase = ph === '夜晚' ? 'night' : 'day';
  }
  if (!scrubbing) timeInput.value = t.toFixed(2);
}

/* ============================================================
   13 · loop
   ============================================================ */
const clock = new THREE.Clock();

function frame() {
  const dt = Math.min(clock.getDelta(), 0.05);
  time += dt;
  updateWind(dt, time);
  updateTimeWeather(dt);

  for (const s of sheepList) updateSheep(s, dt, time);
  updateFootprints(dt);

  for (const c of clouds) {
    c.position.x += 0.12 * dt;
    if (c.position.x > 44) c.position.x = -44;
  }

  for (const tr of treeSway) {
    const c = Math.cos(tr.yaw), sn = Math.sin(tr.yaw);
    const lx = c * wind.x - sn * wind.z;
    const lz = sn * wind.x + c * wind.z;
    const rustle = Math.sin(time * 2.6 + tr.phase) * 0.02 * (0.25 + wind.value);
    const lean = wind.value * 0.12 + rustle;
    tr.canopy.rotation.z = -lx * lean;
    tr.canopy.rotation.x = lz * lean;
    const heavy = Math.max(0, wind.value - 0.5) * 0.06;
    tr.g.rotation.z = -lx * heavy;
    tr.g.rotation.x = lz * heavy;
  }

  waterUniforms.uTime.value = time;
  waterUniforms.uWind.value.set(wind.x, wind.z);
  waterUniforms.uWindStrength.value = wind.value;
  riceUniforms.uTime.value = time;
  riceUniforms.uWind.value.set(wind.x, wind.z);
  riceUniforms.uWindStrength.value = wind.value;

  controls.update();
  camera.updateMatrixWorld();
  updateSelectionUI();

  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

updateTimeWeather(0);
controls.update();
camera.updateMatrixWorld(true);
renderer.render(scene, camera);
refreshHistoryUI();
window.__meadowReady = true;
requestAnimationFrame(frame);

window.__meadow = {
  get sheep() { return sheepList; },
  get selected() { return selected; },
  get history() { return history; },
  get historyIndex() { return hIdx; },
  get time() { return time; },
  get wind() { return wind; },
  get timeOfDay() { return timeOfDay; },
  get rainAmount() { return rainAmount; },
  get snowAmount() { return snowAmount; },
  get wetness() { return wetness; },
  get freeze() { return freeze; },
  setTime: v => { timeOfDay = clamp(v, 0, 24); },
  setWeather: setWeather,
  spawnFootprint: spawnFootprint,
  setSnow: v => { snowAmount = clamp(v, 0, 1); },
  setRain: v => { rainAmount = clamp(v, 0, 1); },
  setFreeze: v => { freeze = clamp(v, 0, 1); },
  setWet: v => { wetness = clamp(v, 0, 1); },
  camera: camera, scene: scene, renderer: renderer, controls: controls,
  terrainH: terrainH, islandSDF: islandSDF, THREE: THREE,
  select: select, setSheepState: setSheepState, doUndo: doUndo, doRedo: doRedo,
  duplicateSelected: duplicateSelected, deleteSelected: deleteSelected,
};
</script>
